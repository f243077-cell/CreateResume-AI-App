name: createresume_app
description: AI-powered resume builder with ATS optimization.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.5.6
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  shared_preferences: ^2.3.1
  pdf: ^3.10.8
  printing: ^5.12.0
  google_fonts: ^8.1.0
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  equatable: ^2.0.5
  dartz: ^0.10.1
  uuid: ^4.4.2
  intl: ^0.20.3
  image_picker: ^1.1.2
  smooth_page_indicator: ^2.0.1
  connectivity_plus: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
